[project]
name = "django-model-rag-demo"
version = "0.1.0"
description = "Integration demo for django-model-rag and django-minimal-rag, installed from their Git repositories."
requires-python = ">=3.14"
dependencies = [
    "django>=5.2",
    "django-minimal-rag",
    "django-model-rag",
]

[tool.uv.sources]
django-model-rag = { git = "https://github.com/gtolivier/django-model-rag", rev = "main" }
django-minimal-rag = { git = "https://github.com/gtolivier/django-minimal-rag", rev = "main" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]
typecheck = [
    "django-stubs[compatible-mypy]>=6.1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --ds rather than DJANGO_SETTINGS_MODULE: an exported variable of that name
# (from another project's shell) would take precedence over the ini option.
addopts = ["--ds=config.settings"]

[tool.mypy]
files = ["catalog", "pages", "config", "tests"]
# Generated by makemigrations, never edited by hand.
exclude = ["/migrations/"]
python_version = "3.14"
strict = true
# A `# type: ignore` must name the error it silences.
enable_error_code = ["ignore-without-code"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"
