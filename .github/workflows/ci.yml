name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major tags (no @v10): pin the full version.
      # The Python version comes from .python-version.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # --locked: test exactly the package commits recorded in uv.lock.
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run python manage.py check
