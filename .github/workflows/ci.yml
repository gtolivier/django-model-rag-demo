name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      # PostgreSQL with pgvector, as compose.yaml starts it locally: same
      # image and port, so the settings' defaults reach it.
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major tags (no @v10): pin the full version.
      # The Python version comes from .python-version.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # --locked: test exactly the package commits recorded in uv.lock.
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run python manage.py check
      - run: uv run pytest
      # The typecheck group is not installed by default: uv run adds it.
      - run: uv run --locked --group typecheck mypy
