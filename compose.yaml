# PostgreSQL with pgvector, which django-minimal-rag needs. Port 5434 on the
# host, so that it runs next to a local PostgreSQL on 5432 and to
# django-minimal-rag's test database on 5433:
#
#   docker compose up -d --wait
#   uv run python manage.py migrate
#
# The settings default to this database; the libpq environment variables
# (PGHOST, PGPORT, PGUSER, PGPASSWORD) point them elsewhere.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: django_model_rag_demo
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres"]
      interval: 2s
      retries: 15
