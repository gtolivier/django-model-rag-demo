{% extends "pages/base.html" %}
{% load i18n %}
{% block content %}
<h1>{% translate "Ask a question" %}</h1>
<form method="post">
{% csrf_token %}
<input type="text" name="question">
<button type="submit">{% translate "Ask" %}</button>
</form>
{% if exchange %}
<div class="exchange">
<p class="question">{{ exchange.question }}</p>
<p class="answer">{{ exchange.text }}</p>
</div>
{% endif %}
{% endblock %}
