{% extends "pages/base.html" %}
{% block title %}{{ page.title }} — {% endblock %}
{% block content %}
<h1>{{ page.title }}</h1>
{% for block in text_blocks %}{{ block.body|linebreaks }}
{% endfor %}{% for item in accordion_items %}<details>
  <summary>{{ item.title }}</summary>
  {{ item.body|linebreaks }}
</details>
{% endfor %}
{% endblock %}
